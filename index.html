<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>米贴 · 开源版（搜索 + 捷径）</title>
  <meta name="description" content="纯前端开源起始页：搜索 + 捷径，数据存本地，零后端。">
  <link rel="icon" href="data:,">
  <!-- 防首屏闪烁：在 CSS 前先定主题 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('meetab_oss_theme');
        var m = raw ? JSON.parse(raw) : 'auto';
        var dark = false;
        if (m === 'dark') dark = true;
        else if (m === 'light') dark = false;
        else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', m || 'auto');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- file:// 直接双击打开的友好提示：本项目用 ES Module，浏览器会拦截本地模块，需起本地服务器 -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var n = document.createElement('div');
        n.id = 'filewarn';
        n.innerHTML = '⚠️ 直接双击打开（file://）无法正常运行：本项目的脚本使用 <b>ES Module</b>，浏览器出于安全策略会拦截本地模块脚本。<br>' +
          '请改用本地服务器打开：在项目目录执行 <code>python3 -m http.server 8080</code>（或双击 <code>serve.sh</code> / <code>serve.bat</code>），再访问 <code>http://localhost:8080</code>。<br>' +
          '部署到 NAS / 任意服务器同理：把整个文件夹当静态站点托管即可。详见 README「运行」一节。';
        document.body.appendChild(n);
      });
    }
  </script>

<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="scrim"></div>

  <!-- 左上角品牌（极简，仿米贴无多余装饰） -->
  <div id="brand">米贴<span class="brand-sub">开源版</span></div>

  <!-- 固定右上工具：添加捷径 + 浏览器扩展 + 设置（双屏共享） -->
  <div id="tools">
    <button id="addShortcut" class="tool-btn" title="添加捷径" aria-label="添加捷径">＋</button>
    <button id="extBtn" class="tool-btn tool-ext" title="浏览器扩展" aria-label="浏览器扩展">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.5 3a1.5 1.5 0 013 0c0 .6.4 1 1 1H17a1 1 0 011 1v3.5c0 .6.4 1 1 1a1.5 1.5 0 100 3c-.6 0-1 .4-1 1V17a1 1 0 01-1 1h-3.5c-.6 0-1 .4-1 1a1.5 1.5 0 11-3 0c0-.6-.4-1-1-1H4a1 1 0 01-1-1v-3.5c0-.6-.4-1-1-1a1.5 1.5 0 110-3c.6 0 1-.4 1-1V4a1 1 0 011-1h3.5c.6 0 1-.4 1-1z" fill="currentColor"/></svg>
    </button>
    <button id="settingsOpen" class="tool-btn" title="设置" aria-label="设置">⚙</button>
  </div>

  <!-- ============ 搜索页（#main） ============ -->
  <main id="main">
    <div class="center">
      <div id="clockWrap" class="clock-wrap" role="button" tabindex="0" aria-label="时钟">
        <div id="clock">--:--</div>
        <div id="date">--</div>
      </div>
      <script>
        /* 时钟首帧前置：不等 app.js，立即写真实时间，避免 --:-- 占位闪烁 */
        (function () {
          function paint() {
            var d = new Date();
            var c = document.getElementById('clock');
            var pend = !!(c && c.textContent.indexOf('--') === 0);
            if (pend) c.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            var de = document.getElementById('date');
            if (de && de.textContent === '--') {
              try { de.textContent = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }); } catch (e) {}
            }
            return !pend;
          }
          if (!paint()) { var t = setInterval(function () { if (paint()) clearInterval(t); }, 15000); }
        })();
      </script>
      <form id="searchForm" class="search" autocomplete="off">
        <button type="button" id="engineBtn" class="engine-btn" title="切换搜索引擎" aria-label="切换搜索引擎">
          <span id="engineIcon" class="engine-icon"></span>
        </button>
        <input type="text" id="searchInput" placeholder="搜索，或直接输入网址…" aria-label="搜索" />
        <div id="engineDropdown" class="engine-dropdown hidden">
          <div class="engine-list" id="engineList"></div>
        </div>
      </form>
    </div>
    <div class="scroll-hint" id="scrollHint">下滑查看全部捷径</div>
  </main>

  <!-- ============ 捷径页（#overlay 全屏覆盖） ============ -->
  <div id="overlay" class="overlay">
    <div class="overlay-inner">
      <div class="overlay-head">
        <div class="overlay-head-left">
          <div id="crumb" class="crumb"></div>
        </div>
        <div class="overlay-head-right">
          <button id="overlayClose" class="overlay-close" type="button" aria-label="返回首页">收起 ↑</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="grid-fade" id="gridFade"></div>
    </div>
  </div>
